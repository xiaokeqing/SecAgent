<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 安全智能助手 SecAgent</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shell.css">
    <!-- 各功能视图样式（分别归属对应功能模块） -->
    <link rel="stylesheet" href="views/alerts.css">
    <link rel="stylesheet" href="views/response.css">
    <link rel="stylesheet" href="views/knowledge.css">
    <link rel="stylesheet" href="views/events.css">
    <link rel="stylesheet" href="views/evals.css">
    <link rel="stylesheet" href="views/rbac.css">
    <!-- Markdown 渲染库；DOMPurify：渲染结果消毒，防 XSS（已本地化，离线可用） -->
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <!-- 代码高亮库（本地化完整打包版） -->
    <link rel="stylesheet" href="vendor/github.min.css">
    <script src="vendor/highlight.min.js"></script>
    <!-- 图表库：告警大屏/评测使用（本地化） -->
    <script src="vendor/chart.umd.min.js"></script>
</head>
<body>
    <!-- 登录 / 欢迎封面 -->
    <div class="cover" id="cover">
        <div class="cover-mask"></div>
        <div class="cover-panel">
            <div class="cover-badge">网络安全智能分析系统</div>
            <h1 class="cover-title">SecAgent</h1>
            <p class="cover-sub">AI 驱动的智能 SOC 助手 · 自动研判 · 人在回路处置</p>
            <div class="cover-form">
                <input type="text" class="cover-input" id="coverUser" placeholder="账号" value="admin">
                <input type="password" class="cover-input" id="coverPass" placeholder="密码">
                <button class="cover-enter-btn" id="enterBtn">进入系统</button>
            </div>
            <div class="cover-hint" id="coverHint">默认账号 admin / admin123</div>
            <div class="cover-hint" id="coverError" style="color:#ff9aa2;display:none;"></div>
        </div>
    </div>
    <!-- 封面登录逻辑统一迁入 app.js，走后端真实鉴权 -->

    <div class="app-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">AI 安全智能助手</h2>
            </div>
            
            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>新建对话</span>
                </button>
                
                <div class="chat-history-section">
                    <div class="history-header">
                        <span>近期对话</span>
                    </div>
                    <div class="chat-history-list" id="chatHistoryList">
                        <!-- 历史对话列表将在这里动态生成 -->
                    </div>
                </div>
                
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 顶部导航：登录后由 common.js 按角色显示/隐藏 -->
            <nav class="topnav">
                <div class="topnav-brand">SecAgent</div>
                <div class="topnav-menu">
                    <button class="topnav-item active" data-view="chat">对话研判</button>
                    <button class="topnav-item" data-view="alerts">告警大屏</button>
                    <button class="topnav-item" data-view="response" data-role="ADMIN">处置中心</button>
                    <button class="topnav-item" data-view="knowledge">知识库</button>
                    <button class="topnav-item" data-view="events">事件归档</button>
                    <button class="topnav-item" data-view="evals">红队评测</button>
                    <button class="topnav-item" data-view="rbac" data-role="ADMIN">用户权限</button>
                </div>
                <div class="topnav-right">
                    <span id="topnavUser"></span>
                    <button id="topnavLogout">退出登录</button>
                </div>
            </nav>

            <div class="view-stage">
            <!-- 对话研判视图（原有功能） -->
            <section class="view active" id="view-chat">
            <button class="ai-ops-top-btn" id="aiOpsSidebarBtn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>安全研判</span>
            </button>
            <div class="chat-container">
                <div class="welcome-greeting" id="welcomeGreeting">
                    <p>你好！我是 SecAgent 网络安全智能助手，可以查安全知识库、查告警与日志、做安全事件研判</p>
                </div>
                <div class="chat-messages" id="chatMessages">
                </div>
                
                <div class="chat-input-container">
                    <div class="input-group-wrapper">
                        <div class="input-wrapper">
                            <input type="text" id="messageInput" placeholder="问漏洞原理、查告警日志、或点右上角“安全研判”自动分析" maxlength="1000" class="message-input">
                            <div class="input-bottom-bar">
                                <div class="tools-btn-wrapper">
                                    <button class="tools-btn" id="toolsBtn" title="更多选项">
                                        <svg class="tools-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                                            <circle cx="19" cy="12" r="1.5" fill="currentColor"/>
                                            <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
                                        </svg>
                                    </button>
                                    <div class="tools-menu" id="toolsMenu">
                                        <div class="tools-menu-item" id="uploadFileItem">
                                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                            <span>上传文件</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="right-actions">
                                    <div class="mode-selector-wrapper">
                                        <button class="mode-selector-btn" id="modeSelectorBtn">
                                            <span id="currentModeText">快速</span>
                                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                        <div class="mode-dropdown" id="modeDropdown">
                                            <div class="dropdown-header">选择对话方式</div>
                                            <div class="dropdown-item active" data-mode="quick">
                                                <div class="dropdown-item-main">
                                                    <span>快速</span>
                                                    <span class="badge-new">新</span>
                                                </div>
                                                <div class="dropdown-item-sub">快速对话</div>
                                            </div>
                                            <div class="dropdown-item" data-mode="stream">
                                                <div class="dropdown-item-main">
                                                    <span>流式</span>
                                                </div>
                                                <div class="dropdown-item-sub">流式对话</div>
                                            </div>
                                        </div>
                                    </div>
                                    <button class="send-btn-circle" id="sendButton" title="发送">
                                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".txt,.md,.markdown" style="display: none;">
                </div>
            </div>
            </section>

            <!-- 告警大屏视图 -->
            <section class="view" id="view-alerts"></section>
            <!-- 处置中心视图（管理员） -->
            <section class="view" id="view-response"></section>
            <!-- 知识库视图（含待审核） -->
            <section class="view" id="view-knowledge"></section>
            <!-- 事件归档视图 -->
            <section class="view" id="view-events"></section>
            <!-- 红队评测视图 -->
            <section class="view" id="view-evals"></section>
            <!-- 用户权限视图（管理员） -->
            <section class="view" id="view-rbac"></section>
            </div>
        </main>
    </div>

    <!-- 加载遮罩层 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在汇聚安全告警与日志、多 Agent 研判中，请稍候...</div>
            <div class="loading-subtext">后端正在处理，请耐心等待</div>
        </div>
    </div>

    <!-- 公共层（路由/API/角色），须先于各视图加载 -->
    <script src="common.js"></script>
    <!-- 各功能视图（向 SecUI 注册） -->
    <script src="js/views/alerts.js"></script>
    <script src="js/views/response.js"></script>
    <script src="js/views/knowledge.js"></script>
    <script src="js/views/events.js"></script>
    <script src="js/views/evals.js"></script>
    <script src="js/views/rbac.js"></script>
    <!-- 原有对话逻辑 -->
    <script src="app.js"></script>
</body>
</html>
