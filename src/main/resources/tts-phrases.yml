# ============================================================
# 服务端 TTS 短语表（POST /api/public/tts 的第一道闸）
# ------------------------------------------------------------
# 键的路径【就是】配置键空间 app.tts.phrases.<phraseId>：
#   app.tts.phrases.welcome     → 前端 POST {"phraseId":"welcome"}
# 值是服务端唯一允许合成的文本（前端【永远】不传文本，只传 phraseId）。
#
# 【为什么必须这样】匿名端点若接受自由文本，就等于把"任意文字转语音"这个
# 花钱的能力公开出去（还能被用来合成任意内容的口播）。所以短语表是白名单：
# 表里没有的 phraseId 一律 400 TEXT_NOT_ALLOWED，绝不回落成"拿 text 字段凑合"。
#
# 【怎么改】改这个文件并重新部署；或在 .env 里把 APP_TTS_PHRASES_FILE 指到
# 主机上的另一个 yaml（同样的 app.tts.phrases 结构），不必改代码。
#
# ⚠️ 读不到/解析失败时短语表按【空表】处理并打 WARN（不静默）：
#   后果是所有 phraseId 都 400 —— 这是 fail-closed，不会变成"随便合成"。
# ============================================================

app:
  tts:
    phrases:
      welcome: "欢迎来到小可清的安全博客。这里记录真实的攻防过程、告警研判与处置留痕。"
      monitoring: "本站的安全监测数据来自真实主机与蜜罐，页面上的攻击来源与告警都是实际观测到的记录。"
      noscript: "本页面的语音播报由站内自建的文字转语音服务生成，只播报站方预设的固定短语。"
