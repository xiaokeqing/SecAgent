name: CI

# 什么时候跑：
#   · 推到 main —— 保证主干永远是绿的
#   · 任何 PR —— 合并前拦住退化
#   · 手动触发 —— 需要时重跑
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行自动取消，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. 密钥扫描
  # ----------------------------------------------------------
  # 为什么单独一个 job 而且排在最先：
  #   这是唯一一个「一旦出事就不可逆」的检查。
  #   代码写错可以改、测试挂可以修，但真实密钥一旦进了 git 历史，
  #   即使后来删除也还在历史里 —— 只能改写历史 + 轮换密钥，
  #   而这两个动作的代价都很大。
  #
  #   对安全方向的项目来说，公开仓库里有凭据是致命伤。
  #   所以这道关卡要跑得最快、最先失败。
  #
  # 说明：本项目仓库里确实有一些"长得像密钥"的字符串，
  #   但它们是 DLP 检测器的测试样例（要测"能不能识别出 AK"，
  #   就得有个长得像 AK 的字符串）。全部是 AbcDefGhiJklmn 这类
  #   明显构造的值，见 .gitleaks.toml 里的 allowlist。
  # ==========================================================
  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 扫描需要完整历史：只扫当前工作区会漏掉
          # "曾经提交过、后来删掉"的密钥 —— 而那种恰恰是最危险的，
          # 因为它看起来已经删干净了。
          fetch-depth: 0

      - name: gitleaks 扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================
  # 2. 单元测试
  # ----------------------------------------------------------
  # 全量纯逻辑测试（337 条，含 3 条按环境跳过），不依赖外部服务：
  # 凭据校验 / 路径安全 / 敏感内容扫描 / 提示注入边界 / 处置护栏白名单 /
  # 存储可写性 / **离线检索回归集**（RagRetrievalRegressionTest：28 条 query
  # 逐条检查"所问的确切证据"是否在前 5 条内 + 整体门槛 + 口径断言 + 回退一致性；
  # 稀疏检索与重排全部自己实现，查询向量随仓库入库，CI 里零网络零费用）。
  # 这条回归集就是"改完检索怎么知道没变差"的答案 —— 它必须跟着单测一起跑。
  # ==========================================================
  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 运行单元测试
        run: mvn -B test

      # 失败时把测试报告传上来，不然只能看日志猜哪条挂了
      - name: 上传测试报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ==========================================================
  # 3. 红队评测离线回归
  # ----------------------------------------------------------
  # 为什么单独一个 job 而不是并进单元测试：
  #   它要真启动一个 Spring Boot 实例、等健康检查、跑 27 例评测，
  #   耗时和失败原因都和单元测试完全不同。分开能让「是逻辑错还是行为错」
  #   一眼看出来。
  #
  # 为什么值得做：
  #   红队评测原来是「手点一下看个数」，改完安全组件没人知道有没有退化。
  #   没有自动重跑的地方，评测就只是一次性表演 ——
  #   这个 job 让「绕过数不能变多、误报率不能上升」变成硬性关卡。
  #
  # 覆盖边界（必须说清楚，别让"CI 全绿"被理解成"全链路有保障"）：
  #   离线模式不配模型 Key，2 例需要模型的用例自动 SKIPPED，
  #   剩下 25 例覆盖规则类防护。那 2 例走模型的路径 CI 测不到。
  #   不带 Key 是刻意的 —— 花钱和网络抖动都不该进 CI。
  # ==========================================================
  red-team-regression:
    name: 红队评测回归
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 打包（跳过测试，测试已在上一个 job 跑过）
        run: mvn -B -DskipTests package

      - name: 运行红队回归
        run: bash scripts/eval-regression.sh target/sec-agent-1.0-SNAPSHOT.jar

      # 失败时把应用日志留着，方便判断是哪条用例退化了
      - name: 上传失败现场（应用日志）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-failure-context
          path: /tmp/eval-app.log
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================
  # 4. 依赖/代码漏洞扫描（Trivy fs）
  # ----------------------------------------------------------
  # 为什么不和 gitleaks 合并：
  #   两件事完全不同。gitleaks 找的是「凭据/密钥泄漏」（本项目 §18 里
  #   那处 registry 凭据残余风险属于这一类）；Trivy 找的是
  #   「某个依赖停在了有已知漏洞的版本上」—— 靠人 review pom.xml 是
  #   查不出来的（传递依赖一大半不在文件里出现）。
  #
  # 阻断口径（写清楚，不留模糊地带）：
  #   · severity = HIGH / CRITICAL  →  命中即 exit-code 1 → job 失败
  #   · MEDIUM / LOW               →  不阻断（只在日志里出现）
  #   · 不开 Trivy 的 secret 扫描器 —— gitleaks 已覆盖，重复扫只是白花 CI 时间
  #
  # 为什么先跑一次 mvn package（而不是直接扫）：
  #   Trivy 解析 Java 依赖需要能算出依赖树 / 拿到构建产物。
  #   算不出来时它的表现是「Java 依赖一条都不报」—— 而那在报告里
  #   和「Java 依赖没问题」长得一模一样。本项目最忌讳这种静默降级
  #   （见铁律②），所以这里先显式把依赖与 jar 准备出来再扫。
  #
  # 速度取舍：
  #   这个 job 不串在 secret-scan → unit-tests → red-team-regression 链上，
  #   与它们并行，所以不会拉长既有链路的墙钟时间；Trivy 漏洞库用
  #   actions/cache 缓存（命中缓存时扫描本身只有几秒）。代价是
  #   runner 总用量 +1 个 job（含一次 mvn package）。
  #
  # 为什么不用 aquasecurity/trivy-action：
  #   ① 本仓库的规矩是"结论要有运行态证据"——这个 job 用的版本
  #      （0.75.0）已经在本机真跑过一次（见交付说明里的输出摘要），
  #      而不是我猜的一个 action tag；
  #   ② 官方 tar.gz 的 sha256 直接钉在下面，CI 装到的东西可复现；
  #   ③ 少一个第三方 Action 的供应链面。
  # ==========================================================
  trivy-fs:
    name: 漏洞扫描（Trivy fs）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17（顺带用 maven 缓存把依赖拉起来）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 产出 target/*.jar：既喂饱 Java 依赖解析，又让 Trivy 能直接扫 jar 内部依赖
      - name: 构建（跳过测试：测试已由 unit-tests job 负责）
        run: mvn -B -DskipTests package

      - name: 缓存 Trivy 漏洞库
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          # run_id 做 key，restore-keys 复用上一份库：漏洞库每天更新，
          # 差几个小时不影响"阻断与否"的判断，但能省掉一次全量下载
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - name: 安装 Trivy 0.75.0（校验 sha256）
        run: |
          set -euo pipefail
          TRIVY_VERSION=0.75.0
          # 本机下载 Linux-64bit 包后算出的 sha256（与下面 URL 一一对应）
          TRIVY_SHA256=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          curl -sSfL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: 扫描（HIGH/CRITICAL 阻断）
        run: |
          set -euo pipefail
          # --exit-code 0：有 HIGH/CRITICAL 就让这一步失败（也就让整个 job 失败）
          trivy fs \
            --scanners vuln \
            --severity "HIGH,CRITICAL" \
            --exit-code 0 \
            --no-progress \
            --format table \
            .

      # 不管拦没拦住都留一份机器可读的结果，方便回溯"当时到底报了哪些"
      - name: 上传扫描结果（JSON）
        if: always()
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln \
            --severity "HIGH,CRITICAL" \
            --no-progress \
            --format json \
            --output trivy-fs.json \
            . || true

      - name: 上传 JSON 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs.json
          retention-days: 14
          if-no-files-found: ignore
