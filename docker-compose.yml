# ============================================================
# SecAgent 容器编排
# ------------------------------------------------------------
# 使用方式：
#   1. cp .env.example .env     并填入真实凭据
#   2. docker compose up -d
#   3. docker compose logs -f   （看到 Started Main 即成功）
#
# 设计要点：
#   · 端口只绑定 127.0.0.1，不直接暴露公网；对外由反向代理/隧道接入
#   · 强制凭据校验（SECAGENT_STRICT_CREDENTIALS=true）：带着默认口令起不来
#   · 限制内存上限，避免单容器拖垮整机
#   · data/ 与 uploads/ 挂载卷持久化，换机时打包带走即可
# ============================================================

services:
  secagent:
    build:
      context: .
      dockerfile: Dockerfile
    # 若已由 CI 构建并推送镜像，改用下面这行、并删掉上面的 build：
    # image: registry.cn-hangzhou.aliyuncs.com/你的命名空间/secagent:latest
    image: secagent:local
    container_name: secagent
    restart: unless-stopped

    # ⚠️ 只绑本机回环地址：外网无法直连 9900，
    #    对外访问统一走反向代理或隧道（见 Cloudflare Tunnel / Tailscale Funnel）
    ports:
      - "127.0.0.1:9900:9900"

    env_file:
      - .env

    environment:
      # ---------- 凭据 ----------
      # 对外部署必须为 true：检测到默认/弱口令将直接拒绝启动（fail-closed）
      SECAGENT_STRICT_CREDENTIALS: "true"

      # ---------- 首次部署：构建安全知识库 ----------
      # 默认 false。若 data/vector-store.json 不存在，首次启动前先设为 true
      # 跑一次（会调用 Embedding API，产生少量费用，几分钟），
      # 生成后改回 false，之后重启不再重复花钱。
      VECTOR_KB_AUTO_INDEX: "${VECTOR_KB_AUTO_INDEX:-false}"

      # 构建信息：由部署脚本传入当次 commit。
      # 健康接口返回它，整体检查拿它跟仓库 HEAD 比对 ——
      # 这样"忘了部署"（部署漂移）会自己暴露，不靠人记得。
      BUILD_SHA: "${BUILD_SHA:-unknown}"
      # 双指纹（P0-4）：不只看"声称的版本"，还看服务器源码与真实产物
      APP_BUILD_SOURCE_SHA: "${SOURCE_SHA:-unknown}"
      APP_BUILD_ARTIFACT_MD5: "${ARTIFACT_MD5:-unknown}"
      BUILD_TIME: "${BUILD_TIME:-unknown}"
      # SSH 直连封禁（处置的首选路径）
      BLOCK_SSH_ENABLED: "${BLOCK_SSH_ENABLED:-true}"
      BLOCK_SSH_HOST: "${BLOCK_SSH_HOST:-43.143.114.79}"
      BLOCK_SSH_PORT: "${BLOCK_SSH_PORT:-22}"
      BLOCK_SSH_USER: "${BLOCK_SSH_USER:-root}"
      BLOCK_SSH_KEY: "/opt/keys/secagent_block_ed25519"
      BLOCK_SSH_KNOWN_HOSTS: "/opt/keys/known_hosts"
      # 【关键】用 Spring 的宽松绑定命名再传一遍。
      # 为什么需要：上面那几个 BLOCK_SSH_* 名字与 Spring 属性路径
      # （integration.block.ssh.host）不匹配，导致 yml 里的
      # ${BLOCK_SSH_HOST:} 占位符解析不到值、回落到空默认值 ——
      # 结果 isEnabled()=false，处置一直走 MOCK。
      # 启动自检打印出 host=[] 才把这个问题暴露出来。
      # Spring 的宽松绑定会把 INTEGRATION_BLOCK_SSH_HOST 直接映射到
      # integration.block.ssh.host，不依赖 yml 占位符是否被解析。
      INTEGRATION_BLOCK_SSH_ENABLED: "true"
      INTEGRATION_BLOCK_SSH_HOST: "43.143.114.79"
      INTEGRATION_BLOCK_SSH_PORT: "22"
      INTEGRATION_BLOCK_SSH_USER: "root"
      INTEGRATION_BLOCK_SSH_KEY: "/opt/keys/secagent_block_ed25519"
      INTEGRATION_BLOCK_SSH_KNOWN_HOSTS: "/opt/keys/known_hosts"

      # ===== 接真实 Wazuh（B3）=====
      # 为什么是 host.docker.internal 而不是 127.0.0.1：
      #   SecAgent 跑在容器里，容器内的 127.0.0.1 是容器自己。
      #   而隧道建在宿主机的 docker 网桥网关上（172.18.0.1），
      #   host.docker.internal 通过 host-gateway 正好指向那里。
      #   这样"容器能访问、公网访问不到"，也不用暴露任何端口。
      WAZUH_URL: "${WAZUH_URL:-https://wazuh-tunnel:55000}"
      WAZUH_USER: "${WAZUH_USER:-wazuh-wui}"
      WAZUH_PASS: "${WAZUH_PASS:-}"
      # 告警数据源：indexer（OpenSearch）。详见 application.yml 的说明。
      WAZUH_INDEXER_URL: "${WAZUH_INDEXER_URL:-}"
      WAZUH_INDEXER_USER: "${WAZUH_INDEXER_USER:-admin}"
      WAZUH_INDEXER_PASS: "${WAZUH_INDEXER_PASS:-}"

      # ---------- 对外 Demo 的调参 ----------
      # 用 SPRING_APPLICATION_JSON 显式覆盖，避免依赖环境变量与
      # 嵌套配置项之间的名称转换规则。
      #
      # self-assets 是「操作者知识」（我自己的公网资产有哪些），
      # 代码里猜不出来，必须由部署者按实际填。留空时应用会打告警日志提醒。
      SPRING_APPLICATION_JSON: >-
        {"app":{"quota":{"daily-limit":${DAILY_QUOTA:-50},
                         "eval-daily-limit":${APP_QUOTA_EVAL_DAILY_LIMIT:-60},
                         "public-daily-limit":${APP_QUOTA_PUBLIC_DAILY_LIMIT:-30}},
                 "ratelimit":{"requests-per-minute":${RATE_LIMIT_PER_MINUTE:-30}},
                 "cors":{"allowed-origins":"${CORS_ALLOWED_ORIGINS:-http://localhost:9900}"},
                 "response":{"self-assets":"${SECAGENT_SELF_ASSETS:-}"}},
         "vector":{"kb":{"auto-index":${VECTOR_KB_AUTO_INDEX:-false}}}}

      # ===== 三个额度池的上限（用户 / 评测 / 匿名公开演示，P4 起）=====
      # ★ 开发期临时上限，发布前必须改回 50/60/30（见 RUNBOOK「发布前回收清单」）
      # 为什么必须显式写在这里，而不是只靠 .env 的 env_file：
      #   上面那段 SPRING_APPLICATION_JSON 的优先级【高于】环境变量绑定，
      #   所以"在 .env 里加一行 APP_QUOTA_PUBLIC_DAILY_LIMIT"其实不会生效 ——
      #   而它不会报错，只会静默沿用 compose 里写死的默认值。
      #   这里显式透传，等于把"配置从哪来"钉在部署面上。
      APP_QUOTA_DAILY_LIMIT: "${APP_QUOTA_DAILY_LIMIT:-50}"
      APP_QUOTA_EVAL_DAILY_LIMIT: "${APP_QUOTA_EVAL_DAILY_LIMIT:-60}"
      APP_QUOTA_PUBLIC_DAILY_LIMIT: "${APP_QUOTA_PUBLIC_DAILY_LIMIT:-30}"

      # ===== 公开面 IP 显示口径（2026-10-14 站主拍板：默认显示真实来源 IP）=====
      # 【为什么必须显式写在这里】与 APP_QUOTA_*/APP_RAG_* 同一个教训：
      #   上面的 SPRING_APPLICATION_JSON 优先级高于环境变量绑定，凡是它覆盖到的属性，
      #   "在 .env 里加一行"都不生效且不报错。app.public.* 目前不在那段 JSON 里，
      #   但仍然显式透传 —— 把"这个口径从哪来"钉在部署面上，将来谁往 JSON 里加一笔也不会静默改口径。
      # false = 显示观测到的真实来源 IP（默认，站主拍板）；true = 掩码（改造前口径）。
      # 影响所有 /api/public/** 端点；内网/保留地址在任何口径下都写「内网/未知」。
      APP_PUBLIC_MASK_IPS: "${APP_PUBLIC_MASK_IPS:-false}"
      APP_PUBLIC_REMOVAL_CONTACT: "${APP_PUBLIC_REMOVAL_CONTACT:-https://xiaokeqing.cn/about/}"
      APP_PUBLIC_ASSET_BLOCKLIST: "${APP_PUBLIC_ASSET_BLOCKLIST:-web-01,web-02,web-03,db-01,auth.log,/api/order/detail,/upload/files/}"

      # ===== 离线地理富化（DB-IP Lite，CC BY 4.0；RUNBOOK §26）=====
      # 与额度/检索同一个教训：**必须在 environment 段显式透传**，否则"在 .env 里加一行"不生效且不报错。
      # 库文件放在 /opt/secagent/geoip（宿主机，600/700，属主 999:999），只读挂载到 /opt/geoip：
      #   · 库不进镜像、不进仓库（许可要署名，体积 80MB+，且它是"数据"不是"代码"）；
      #   · 容器里配的是挂载后的路径（/opt/geoip/...），不是宿主机路径。
      # 库缺失时**不会静默降级成空分布**：/api/public/geo 会如实返回 available=false + GEO_DB_MISSING。
      APP_GEOIP_ENABLED: "${APP_GEOIP_ENABLED:-true}"
      APP_GEOIP_CITY_DB: "${APP_GEOIP_CITY_DB:-/opt/geoip/dbip-city-lite.csv.gz}"
      APP_GEOIP_ASN_DB: "${APP_GEOIP_ASN_DB:-/opt/geoip/dbip-asn-lite.csv.gz}"
      # 关掉 IPv6 区间可省约 80MB 常驻内存（IPv6 来源会归为"未定位"）；默认 true。
      APP_GEOIP_IPV6_ENABLED: "${APP_GEOIP_IPV6_ENABLED:-true}"
      # 我方公网/内网出口 IP（逗号分隔）。不填的后果是具体的：实测 24h 的 data.srcip 第 2 名
      # 就是 srv2 自己的公网 IP，于是"攻击来源 TOP"里会出现我们自己的服务器。
      # 服务器真实 IP 不进仓库 —— 由 /opt/secagent/.env 注入。
      APP_GEOIP_SELF_IPS: "${APP_GEOIP_SELF_IPS:-}"
      # 来源 IP 的字段名：主机侧/蜜罐写 data.srcip，Suricata 写 data.src_ip（实测两种并存）。
      APP_GEOIP_SRC_IP_FIELDS: "${APP_GEOIP_SRC_IP_FIELDS:-data.srcip,data.src_ip}"
      # 入榜门槛：count>=3 且占比>=1%（防"1 次攻击刷榜"与长尾噪声占满榜单）。
      APP_GEOIP_MIN_COUNT: "${APP_GEOIP_MIN_COUNT:-3}"
      APP_GEOIP_MIN_SHARE_PERCENT: "${APP_GEOIP_MIN_SHARE_PERCENT:-1.0}"
      APP_GEOIP_TOP_IPS: "${APP_GEOIP_TOP_IPS:-1000}"

      # ===== 混合检索参数（两路召回 + RRF + 轻量重排，RUNBOOK §25）=====
      # 与额度同理：这段必须显式透传，否则"在 .env 里加一行"不会生效而它不报错。
      # 全部可留空（留空即用代码默认值，与改造前行为兼容）。
      # 回退纯稠密：把 APP_RAG_SPARSE_ENABLED 与 APP_RAG_RERANK_ENABLED 同时置 false。
      APP_RAG_SPARSE_ENABLED: "${APP_RAG_SPARSE_ENABLED:-true}"
      APP_RAG_RRF_K: "${APP_RAG_RRF_K:-60}"
      APP_RAG_RERANK_ENABLED: "${APP_RAG_RERANK_ENABLED:-true}"
      APP_RAG_TOP_K: "${APP_RAG_TOP_K:-3}"
      APP_RAG_MIN_SCORE: "${APP_RAG_MIN_SCORE:-0.30}"

      # ===== 评测身份（独立凭据 + 独立额度 + 流量打标）=====      # 为什么必须显式写在这里，而不是只依赖 env_file:
      #   env_file 是"运行时兜底"—— .env 里漏了 APP_EVAL_TOKEN 时容器照样起来，
      #   评测身份静默关闭（app.eval.token 为空即功能关闭），外部看不出任何异常；
      #   下一轮评测又会退回管理员账号密码，于是"跑完评测当天用户没额度"这个
      #   老问题会悄悄回来。显式声明 + 下面的默认空值把这条依赖写在部署面上。
      #
      # 空值时的行为：评测身份关闭，行为与改造前一致（不影响任何现有功能）。
      # 一旦配置，该 token 只能调 /api/chat，且模型调用走 data/model-quota-eval.json
      # 这个独立计数器 —— 用户额度 50/天 不会被评测跑卷吃光。
      # 生成：openssl rand -hex 32，写入 /opt/secagent/.env（权限 600），不要进 git。
      APP_EVAL_TOKEN: "${APP_EVAL_TOKEN:-}"

      # ===== 对话模型供应商：DashScope ⇄ DeepSeek（RUNBOOK §28）=====
      # 【为什么必须显式写在这里】与 APP_QUOTA_*/APP_RAG_* 同一个教训：
      #   上面的 SPRING_APPLICATION_JSON 优先级【高于】环境变量绑定，凡是它覆盖到的属性，
      #   "在 .env 里加一行"都不生效且不报错。app.llm.* 目前不在那段 JSON 里，
      #   但仍然显式透传 —— 把"这个开关从哪来"钉在部署面上。
      # 默认 dashscope = 改造前口径（qwen-plus）；改 deepseek 后按发布链重建容器。
      # ⚠️ 对话可换、向量不可换：DASHSCOPE_API_KEY 不能撤（DeepSeek 没有 embedding API）。
      APP_LLM_PROVIDER: "${APP_LLM_PROVIDER:-dashscope}"
      # 默认空 = 关闭跨供应商回退（主不可用 → 上层如实判未生成）。
      # 开启后回答里的 generatedBy 会如实改成真正生成的那家，绝不悄悄换一家还署原名。
      APP_LLM_FALLBACK_PROVIDER: "${APP_LLM_FALLBACK_PROVIDER:-}"
      # 【不写默认值】Key 只从 .env（600 权限）注入；写成 compose 里的默认值
      # 等于把凭据放进仓库。空 = 该供应商不可用并在启动自检里显式打印 MISSING。
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # 可选覆盖（一般不用写）：默认值就是 application.yml 里那些。
      APP_LLM_DEEPSEEK_MODEL: "${APP_LLM_DEEPSEEK_MODEL:-deepseek-chat}"
      APP_LLM_DEEPSEEK_BASE_URL: "${APP_LLM_DEEPSEEK_BASE_URL:-https://api.deepseek.com}"

      TZ: Asia/Shanghai

    volumes:
      # 只读挂载封禁密钥 —— 密钥不进镜像（镜像会被 save/scp，甚至可能推到仓库）
      - /opt/secagent/keys:/opt/keys:ro
      # 离线地理库（DB-IP Lite，CC BY 4.0）：宿主机 /opt/secagent/geoip → 容器 /opt/geoip（只读）。
      # 为什么用只读挂载而不是打进镜像：80MB+ 的第三方数据（许可要求署名、体积不该进镜像层），
      # 且月度更新只需换文件 + 重建容器，不用重新构建镜像。
      # 目录 700 / 文件 600 / 属主 999:999：容器以 uid 999 运行（能读），宿主机其它用户读不到。
      - /opt/secagent/geoip:/opt/geoip:ro
      # 运行数据持久化：向量库、审计留痕、封禁记录、评测结果
      - ./data:/app/data
      - ./uploads:/app/uploads

    # 内存硬上限：超过时本容器被 OOM Kill，而不是拖垮整台机器
    mem_limit: 1536m
    # host-gateway 让容器能访问宿主机上的服务（这里是 SSH 隧道）。
    # 用 host.docker.internal 这个名字而不是写死 IP：
    # docker 网桥的网关 IP（172.18.0.1）在网络重建后会变，
    # 写死的话某天会静默失效 —— 而"连不上 Wazuh"在这个系统里
    # 会【自动降级成 MOCK】，页面照常显示，只是数据变成假的了。

    extra_hosts:
      # 【不能写 host-gateway】它会解析成 docker0 默认网桥的网关（172.17.0.1），
      # 而本容器在 compose 自建网络上（172.18.0.0/16）——
      # 两个 docker 网络之间没有路由，容器会报 "No route to host"。
      # 必须指向【容器自己的网关】，由部署脚本探测后注入。
      - "host.docker.internal:${WAZUH_HOST_IP:-172.17.0.1}"
    memswap_limit: 2g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9900/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 低配机器上 Spring 上下文初始化需要 40~90 秒，给少了会被误判为不健康
      start_period: 120s

  # ============================================================
  # Wazuh 隧道 sidecar
  # ------------------------------------------------------------
  # 为什么把隧道做成容器，而不是在宿主机上开一条 SSH：
  #
  # 原来是在宿主机建 systemd 隧道，绑到 docker 网桥网关，
  # 让容器通过 host.docker.internal 访问。折腾了很久都没通：
  #   · host-gateway 解析成 docker0 网关（172.17.0.1），
  #     而容器在 compose 网络（172.18.0.0/16）—— 两个网络之间无路由
  #   · 改成绑容器自己的网关（172.18.0.1）后，抓包显示
  #     容器的 SYN 到了宿主机，但没有 SYN-ACK 回来
  #     （回程正常、rp_filter=0、iptables INPUT 无规则 —— 原因没查清）
  #
  # 结论：【不该让容器的出流量绕到宿主机再回来】。
  # 把隧道放进同一个 compose 网络，SecAgent 直接连 wazuh-tunnel:55000，
  # 就是普通的容器间通信 —— 从架构上就不会碰到宿主网络那些坑。
  #
  # 顺带的好处：
  #   · 隧道和它所服务的应用在同一个 compose 里，启停一致
  #   · 不用改宿主机防火墙、不用探测网关 IP、没有 IP 漂移问题
  # ============================================================
  wazuh-tunnel:
    image: secagent-tunnel:local
    container_name: wazuh-tunnel
    restart: unless-stopped
    # 镜像的 ENTRYPOINT 就是 ssh，这里只传参数。
    # 不在容器里 apk add：阿里云那台机器连不上 alpine 的 CDN，
    # 也连不上阿里云镜像源，装不上 ssh（日志只有一行 "ssh: not found"）。
    # 改成在开发机构建好镜像、随部署一起传过去 —— 不再依赖服务器能否访问外网源。
    command:
      - "-NT"
      - "-i"
      - "/keys/tunnel_srv2_ed25519"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "UserKnownHostsFile=/dev/null"
      - "-o"
      - "ExitOnForwardFailure=yes"
      - "-o"
      - "ServerAliveInterval=30"
      - "-o"
      - "ServerAliveCountMax=3"
      - "-o"
      - "ConnectTimeout=15"
      - "-L"
      - "0.0.0.0:55000:127.0.0.1:55000"
      - "-L"
      - "0.0.0.0:9200:127.0.0.1:9200"
      - "root@43.143.114.79"
    # 只读挂载专用隧道密钥（在服务器 2 上被限制为
    # 只能转发 55000、不能执行任何命令）
    #
    # 【必须写在这里，不能写成 command 的一项】
    # 曾经它被误当成 command 列表的最后一项，YAML 语法完全合法、
    # 容器也能起来，但密钥根本没挂进容器 —— 日志刷
    # "Identity file /keys/tunnel_srv2_ed25519 not accessible"，
    # 隧道崩溃循环 restart=65，SecAgent 于是静默降级成 MOCK 数据。
    # 这类"语法合法、语义错位"的配置改错，只能靠运行态（docker inspect
    # 的 Mounts）验证，不能靠看文件或 grep 判断。
    volumes:
      - /root/.ssh/tunnel_srv2_ed25519:/keys/tunnel_srv2_ed25519:ro
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
