# ============================================================
# fail2ban 过滤器：URL 级 Web 扫描 / 探测 / 路径穿越（应用侧访问日志）
# ------------------------------------------------------------
# 输入文件：/opt/secagent/data/access.jsonl
#   = 应用容器里的 data/access.jsonl（compose 里 ./data:/app/data 挂载，宿主可见）
#   由 org.example.accesslog.AccessLogFilter 写（见 RUNBOOK §24）
#
# 【为什么直接读 JSONL，而不是复用 §21 的 app.log 镜像】
#   1. 应用日志里根本没有这些请求 —— Spring 不记未匹配路由，
#      /wp-login.php 这类请求返回 404 且一行不落（RUNBOOK §21.2 第 1 条实测）。
#      只有应用侧的访问日志才有这个信息，JSONL 就是它的落点。
#   2. 结构化字段让"只匹配 path、只取 clientIp"成为可能：
#      同一行里既有 path 又有 status 与 clientIp，不需要从自由文本里猜。
#   3. 误报面更小：整行是我们自己序列化的固定字段顺序，
#      不会因为 UA/上游报文里的字样而误命中（下面每条正则都锁定了
#      "token 必须出现在 path 字段的值里"）。
#
# 【字段顺序是契约】AccessLogFilter 固定按下面顺序输出：
#   ts, method, path, queryKeys, status, clientIp, ua, ms, reqId
#   改顺序会同时打断本文件与 secagent-webscan-4xx.conf，改前先看 RUNBOOK §24。
#
# 【刻意不做的事】
#   × 不匹配查询串的值 —— 应用侧压根不落查询串原文（只落键名 queryKeys），
#     所以 `?q=../../etc/passwd` 这种形态在本文件里【看不见】。
#     这是"不记录敏感内容"与"可检测性"之间有意选的取舍，如实记在 RUNBOOK §24。
#   × 不封回环/云厂商/自测网段 —— 见 jail.d/secagent-webscan.local 的 ignoreip。
# ============================================================
[Definition]

# 行首就是我们自己写的 ISO 时间戳（带时区）。
# 不写日期模板会退化成"用当前时间"（findtime 仍可用，但审计上不精确）。
datepattern = ^\{"ts":"%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?(?:[+-]\d{2}:?\d{2})?"

# 已知被扫的路径形态。要求：
#   ① 关键字必须落在 path 字段的值里（[^"]* 无法跨越引号，天然锁死在 path 内）
#   ② clientIp 必须是合法 IP 字面量（应用侧已校验，非法值回落 remoteAddr）。
#      fail2ban 要求每条 failregex 里必须有 <HOST> 分组，否则该条正则被判非法并【静默跳过】——
#      实测：写一条不带 <HOST> 的正则，fail2ban-regex 报 0 matched 且不报错。
#   ③ 用 "method":"..","path":".." 这段字段序列来认"这是我们自己的访问日志行"。
#
# 【为什么不写 ^\{"ts":"... 开头（实测踩到，写在 §24 里）】
#   fail2ban 先用 datepattern 匹配时间戳，并把【匹配到的那一段从行里删掉】再把剩下的文本
#   交给 failregex。而 datepattern 的捕获组覆盖 `{"ts":"2026-10-13T20:31:00.101+08:00"` 整段
#   （含 JSON 前缀与结尾引号），于是 failregex 看到的是
#       ,"method":"GET","path":"/wp-login.php",...
#   —— 任何以 ^\{"ts":" 锚定的正则都会 0 命中（实测：锚定版 0 matched，去掉锚定 1 matched）。
#   所以这里从 "method" 开始写：带不带时间戳前缀都能命中；自检脚本会断言命中数（5/7），
#   万一将来 fail2ban 的剥离行为变了，--apply 会当场拦下并回滚，不会变成一条永不触发的假规则。
#
# ⚠️ 百分号在 fail2ban 的过滤器里是【插值字符】，必须写成 %% ——
#    实测：写成 %2e%2e 时 `fail2ban-client -t` 直接报
#    "'%' must be followed by '%' or '(', found: '%2e%2e|%252e%252e|...'"
#    （装机脚本的 -t 门禁当场拦下并自动回滚，配置没被写坏）。
failregex = "method":"[^"]*","path":"[^"]*(?:/wp-login\.php|/wp-admin|/wp-content/plugins|/xmlrpc\.php|/wp-config\.php|/wp-json/wp/v2/users|/\.env|/\.git/|/\.git$|/\.svn/|/\.hg/|/\.aws/|/\.ssh/|/\.docker/|/\.npmrc|/\.DS_Store|/phpmyadmin|/pma/|/myadmin/|/adminer|/sqlbuddy|/webadmin|/actuator|/manage/|/manager/html|/solr/|/jenkins/|/grafana/|/docker-compose|/vendor/phpunit|/eval-stdin\.php|/(?:shell|c99|r57|webshell|upload)\.php|/etc/passwd|/etc/shadow|/proc/self|/\.\./|%%2e%%2e|%%252e%%252e|/backup\.(?:zip|sql|tar\.gz|7z)|/config\.(?:json|php|yml|yaml|bak)|/(?:db|dump|bak)\.(?:sql|zip|tar\.gz))[^"]*".*"clientIp":"<HOST>"

ignoreregex =
