# ============================================================
# fail2ban 过滤器：SecAgent 公开端点滥用 / 注入尝试
# ------------------------------------------------------------
# 输入文件：/var/log/secagent/app.log
#   由 deploy/secagent-applog-mirror.service 维护
#   （= 应用容器 stdout 的镜像，纯文本，路径稳定）
#
# 为什么只匹配这一条正则 —— 这是清点过应用源码后的结论：
#   srv1 应用日志里【带攻击方 IP】的"公开端点滥用"记录只有一处：
#     PublicAskService.java:101
#     logger.info("公开提问命中注入特征 {} 条，按设计拒绝生成（来源={}）", ...)
#   其余 WARN/ERROR（未处理异常、上游 wazuh-indexer 不可用、限流表过大）
#   都不带来源 IP —— 没有 IP 就无法"按 IP 封禁"，
#   它们交给 Wazuh 做聚合告警（见 deploy/wazuh/srv1_local_rules.xml）。
#
# 反例（本文件刻意不做的事）：
#   × 不写"匹配任意含 IP 的行"。srv1 的公网入站是 cloudflared（127.0.0.1），
#     应用里 getRemoteAddr() 拿到的就是回环；宽泛规则一旦匹配到边缘/回环地址，
#     会把 Cloudflare 或本机封掉 —— 直接整站不可用。
#   × 不匹配 HTTP 404/扫描路径。实测 /wp-login.php、/.env、/../../etc/passwd
#     这些请求应用【一行都不记】（Spring 不记未匹配路由），
#     写了也只会是一条永远不触发的假规则。
# ============================================================
[Definition]

# 应用日志行前缀形如：2026-10-13T11:34:02.526+08:00
datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?(?:[+-]\d{2}:?\d{2})?

failregex = ^.*公开提问命中注入特征 \d+ 条，按设计拒绝生成（来源=<HOST>）.*$

ignoreregex =
