# ============================================================
# fail2ban 过滤器：单 IP 短时间大量 4xx（应用侧访问日志）
# ------------------------------------------------------------
# 输入文件：/opt/secagent/data/access.jsonl（同 secagent-webscan.conf）
#
# 【为什么单独一条过滤器，而不是并进 secagent-webscan】
#   两者的"判据"不同，必须用不同的 maxretry/findtime：
#     · 已知恶意路径：命中一次就足够可疑（maxretry 很小）
#     · 大量 4xx      ：单次 404 完全正常（缺图、失效链接、博客探测），
#                       只有"短时间大量"才是扫描特征（maxretry 必须大）
#   挤在一个 jail 里就只能共用一组阈值 —— 那要么放过扫描，要么把正常用户封掉。
#
# 【能看见什么 / 看不见什么】
#   能：任何 4xx 的 URL 级爆破（目录发现、随机路径、参数爆破的 404 部分）
#   不能：返回 2xx/3xx 的探测（例如命中真实存在的 /api/public/overview）。
#         那类靠 secagent-webscan 的路径特征与 Wazuh 侧聚合告警覆盖。
#
#   字段顺序契约见 secagent-webscan.conf 顶部注释。
# ============================================================
[Definition]

datepattern = ^\{"ts":"%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?(?:[+-]\d{2}:?\d{2})?"

# 4xx = 客户端错误（400 401 403 404 405 429 ...）。5xx 刻意不算：
# 那是我们自己的故障（上游挂了），把访客封掉等于把故障发泄在用户身上，
# 应由 Wazuh 的 ERROR 突增规则（§21 的 100222）去告警。
#
# 不写 ^\{"ts":" 锚定：fail2ban 会先用 datepattern 把 `{"ts":"<时间>"` 这一段从行里删掉
# 再交给 failregex（实测，见 secagent-webscan.conf 顶部说明）；从 "method" 开始写，
# 带不带时间戳前缀都能命中。
failregex = "method":"[^"]*","path":"[^"]*","queryKeys":"[^"]*","status":4\d\d,"clientIp":"<HOST>"

ignoreregex =
