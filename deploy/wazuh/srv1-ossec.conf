<!--
  ============================================================
  srv1（阿里云应用服务器）Wazuh agent 配置
  ------------------------------------------------------------
  权威副本（入库版本）。装机路径：/var/ossec/etc/ossec.conf
  由 scripts/srv1-wazuh-agent-install.sh 安装。
  自定义规则【不在这里】—— Wazuh 的规则匹配发生在 manager 上，
  所以 srv1 相关规则放在 manager 侧：
    deploy/wazuh/srv1_local_rules.xml -> srv2:/opt/wazuh/config/wazuh_cluster/rules/
  ============================================================
-->
<ossec_config>
  <client>
    <server>
      <!-- 走本机回环：由 secagent-wazuh-agent-tunnel.service 把
           srv2 的 127.0.0.1:1514/1515 映射到 srv1 的 127.0.0.1。
           manager 的 1514/1515 至今只绑 srv2 回环，没有对公网开放。 -->
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>alinux, alinux3</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- 只采集"启动之后"的新日志（only-future-events 是 localfile 级选项，
       4.x 起默认就是 yes；这里显式写出来是为了"这是有意的"能被看见）。
       为什么在意：应用日志镜像文件里已经有一堆历史 ERROR（含一次崩溃重启），
       把旧事当新事报一遍只会淹掉真告警。 -->

  <!-- ① 认证日志。
       注意：srv1 是 Alibaba Cloud Linux 3（RHEL 系），认证日志是
       /var/log/secure，【不是】Ubuntu 的 /var/log/auth.log。
       任务书里写的是 auth.log —— 这里按这台机器的事实来。 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- ② systemd 单元状态 / 内核 / 服务失败。
       AL3 上 rsyslog 的 imjournal 会把 journald 的消息落到 /var/log/messages，
       实测这里面有 "secagent-redeploy.service: Succeeded." 这类单元状态行，
       所以用 messages 就能覆盖 secagent-* 单元的成功/失败。 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- ③ fail2ban 自己的动作（谁被封了、谁被解封了）也进 SIEM：
       主机侧的处置动作不能只留在本机日志里。 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/fail2ban.log</location>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- ④ 应用日志镜像（和 fail2ban 同一个文件，一份来源两处用）。
       用 multi-line-regex：Spring Boot 的 ERROR 后面跟着几十行堆栈，
       按行采集会把一条异常拆成几十个事件，把"ERROR 突增"的阈值算歪。
       multiline_regex 命中行首时间戳时开一条新事件，replace=wspace 把
       堆栈里的换行压成空格，让整条异常作为一个事件进 SIEM。

       out_format 这一行是被实测逼出来的（不是装饰）：
       manager 侧规则默认匹配的是"预解码之后剩下的正文"，
       而 srv1 的应用日志行首是 ISO 时间戳，紧跟其后的那个词（ERROR/WARN/INFO）
       会被当作日志级别在预解码阶段吃掉 —— 实测：
         同一条 ERROR 行，regex "ERROR" 不命中，regex "---\s*\[" 命中。
       也就是不处理的话，规则根本看不到 "ERROR" 这个词，"ERROR 突增"无从谈起。
       解法：在采集侧给每行加一个固定的 syslog 头（时间戳 + 程序名），
       让原始行整体落进"正文"里，级别词就重新可见了。 -->
  <localfile>
    <log_format>multi-line-regex</log_format>
    <location>/var/log/secagent/app.log</location>
    <only-future-events>yes</only-future-events>
    <multiline_regex replace="wspace">^\d{4}-\d{2}-\d{2}T</multiline_regex>
    <out_format>$(timestamp %Y-%m-%d %H:%M:%S) secagentapp: $(log)</out_format>
  </localfile>

  <!-- ⑤ docker 容器事件。
       【实测结论】docker-listener wodle 在这台机器上不工作：
         agent 日志里 "Module docker-listener started." 之后约 1 分钟就是
         "Module finished."，manager 侧一条 docker 事件告警都没有；
         单独跑 /var/ossec/wodles/docker/DockerListener 同样产不出事件。
       所以这里【明确关掉】，避免留一个"看起来在监控、实际没数据"的假覆盖。
       容器事件的真实来源改成 dockerd 自己的日志：AL3 的 rsyslog(imjournal)
       把 dockerd 的日志写进 /var/log/messages（上面 ② 已经在采），
       manager 侧用规则 100230/100231 覆盖"容器退出不再重启 / docker 重启"，
       应用自身的 "Started Main in ..." 用规则 100232 覆盖"刚重启过"。
       见 RUNBOOK §21。 -->
  <wodle name="docker-listener">
    <disabled>yes</disabled>
    <interval>1m</interval>
    <attempts>5</attempts>
    <run_on_start>no</run_on_start>
  </wodle>

  <!-- 文件完整性：只保留默认的 /etc /usr/bin /usr/sbin /bin /sbin。
       刻意【不加】/var/lib/docker 与 /opt/secagent/data ——
       那儿每次部署都会变，除了把磁盘和 CPU 吃满没有别的作用。 -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" report_changes="yes">/etc,/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/var/lib/docker</ignore>
    <ignore>/opt/secagent/data</ignore>
  </syscheck>

  <!-- 本机只有 2GB 内存、2 核，且跑着 Java 应用 + docker。
       rootcheck（定期扫 rootkit）与 SCA（定期跑 CIS 基线）在这个规格下
       是"持续吃 CPU、告警价值低"的两项，明确关掉并在 RUNBOOK 里记明；
       任务书要求的三类监控（认证日志 / systemd 单元 / docker 事件 / 应用 ERROR）
       都不依赖它们。 -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <sca>
    <enabled>no</enabled>
  </sca>

  <!-- agent 自身运行日志（排查用） -->
  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
